    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>うさけん</title>
    <!-- ↓これを追加 -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <header>
        <h1>たべたもの</h1>
        <div id="today-date"></div>
    </header>
    <main>
        <div id="tab-bar"></div>
        <div id="menu-grid"></div>

    <div id="total-section">
        <span>合計</span>
        <span id="total-kcal">0</span>
        <span>kcal</span>
        <div id="goal-remaining"></div>
        <div id="progress-bar"></div>
        </div>
    <section>
        <h2>今日の記録</h2>
        <div id="log-list">
            <p class="empty-msg">まだ何も記録されていません</p>
        </div>
        <button onclick="clearAll()">すべてリセット</button>
        <div id="confirm-area" style="display:none;">
            <p>本当に削除しますか？</p>
            <button onclick="confirmClear()">削除する</button>
            <button onclick="cancelClear()">キャンセル</button>
        </div>
    </section>    

    <section id="add-menu-section">
            <h2>メニューを追加</h2>
            <div id="add-menu-form">
                <select id="input-category-select">
                    <option value="">＋ 新しいお店を追加</option>
                </select>
                <input type="text" id="input-category-new" placeholder="新しいお店の名前" style="display:block;" />
                <input type="text" id="input-name" placeholder="メニュー名" />
                <input type="number" id="input-kcal" placeholder="kcal" />
                <button onclick="addMenu()">追加する</button>
            </div>
    </section>
    <button onclick="toggleDeleteMode()" id="delete-mode-btn">削除モード</button>
    <button onclick="deleteTab()" id="delete-tab-btn" style="display:none;">このお店を削除</button>
   <section id="trash-section" style="display:none;">
        <h2>🗑 削除したもの</h2>
         <div id="trash-list">
             <p class="empty-msg">削除したものはありません</p>
            </div>
    </section>
</main>
